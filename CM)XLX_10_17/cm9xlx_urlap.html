<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Űrlap - CM9XLX</title>
        <style>
            html, body{
                font-family: Arial, Helvetica, sans-serif;
                font-size: 16px;
            }

            *{
                box-sizing: border-box;
            }
            
            section{
                width: 50rem;

                background-color: rgb(73, 138, 160);
                padding: 1rem;
                text-align: center;

                border-radius: 0.5rem;
                box-shadow: inset 0 0 0.5rem 0 #00000066,
                0.25rem 0.25rem 0.5rem 0.25rem #000000aa;
            }
            header{
                width: 50rem;
                padding: 1rem;
                text-align: center;
                font-size:  2rem;
                font-weight: bold;
            }

            footer{
                width: 50rem;
                margin-top: 2rem;
                border-top: 0.1rem solid black;
                padding: 1rem;
                text-align: right;
                font-size:  0.8rem;
            }
            label{
                display: block;
                width: 100%;
                text-align: left;
                gap: 1rem;
                margin: 1rem;
            }

            .sidebyside{
                display: flex;
                flex-direction: row;
                gap: 1rem;
                justify-content: left;
            }
            .sidebyside>input{
                width: 10rem;
            }
        </style>
    </head>

    <body>
        <header>
            HTML5 Űrlap - CM9XLX
        </header>

        <section>
            <form action="feldolgozo.php" target="_self" method="post" id="urlap" name="urlap">
                <label for="nev">
                      Név:
                    <input type="text" id="nev" name="nev" required pattern="([A-ZÁÉÍÓÖŐÚÜŰa-záéíóöőúüű]){4}" title="Ird be a neved" placeholder="Ird be a neved" autofocus autocomplete="off">
                </label>
                <label for="pin">
                    Pin kód:
                    <input type="password" id="pin" name="pin" required pattern="[0-9]{4}" title="4 számjegyű PIN kód" 
                    placeholder="pinkod">
                </label>

                <label for ="fav_fruit">
                    Kedvenc Gyümölcs:
                    <input list="gyumolcsok" id="fav_fruit" name="fav_fruit" 
                    placeholder="" title="Alma, Körte. Szőlő. Banán, Narancs">
                    <datalist id="gyumolcsok">
                        <option value="alma">Alma</option>
                        <option value="körte">Körte</option>
                        <option value="szőlő">Szőlő</option>
                        <option value="Banán">Banán</option>
                        <option value="narancs">Narancs</option>
                    </datalist>
                </label>

                <label for ="age">
                    Életkor:
                    <input type="number" id="age" name="age" min="1" max="100" step="1" title="1 és 100 közötti érték" placeholder="">
                </label>

                <label for = "feet_size">
                    Lábméret:
                    <input type="number" id="feet_size" name="feet_size" min="25" max="50" step="0.5" title="25 és 50 közti érték" placeholder="">
                </label>
                <label for="confidence">
                    Önbizalom
                    <input type="range" id="confidence" name="confidence" min="0" max="100" step="0.1" title="0 és 100 közti érték">
                </label>
            </form><br>

            <div class="sidebyside">
                <input type="submit" value="Elküld" form="urlap">
                <input type="submit" value="Elküld ellenőrzés nélkül" formnovalidate form="urlap">
            </div>
        </selection>

    </body>
</html>
