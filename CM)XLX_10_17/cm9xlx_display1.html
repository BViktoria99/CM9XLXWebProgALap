<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Megjelenési Tulajdonság</title>

        <style>
            body{
                font-family: 'Times New Roman', Times, serif;
                margin: 20px;
            }
            h1{
                font-size: 2.5em;
                font-weight: bold;
            }
            b{
                font-size: 1.5em;
            }
            .BV2, .BV3, .BV4, .BV5{
                background: #66c87a;
                padding: 10px;      /*szöveg és keret közti tulajdonság*/
                margin-top: 10px;
                margin-bottom: 10px;
                min-width: 250px;
                max-width: 70vw;
            }

            .BV1 .item{
                display: none;
                padding: 10px;  
                margin-top: 10px;
                margin-bottom: 10px;
                min-width: 250px;
                max-width: 50vw;
            }

            .BV2 .item{
                display: inline;
            }
            .BV3 .item{
                display: block;
            }
            .BV4 .item{
                display: inline-block;
            }
            .BV5 .item{
                display: flex; /*nagyon gyakran használt. Flexibilis*/
            }
            .item{
                background: #7d5bbf;
                color: #222;
                padding: 5px 15px;
                margin-right: 5px;
                margin-top: 5px;
                margin-bottom: 5px;
                border-radius: 2px;
                font-size: 1em;
            }
        </style>
    </head>
    <body>
        <h1>Megjelenési tulajdonságok</h1>

        <b>display: none</b> 
        <div class="BV1">
            <span class="item">PTI BSc 1</span>
            <span class="item">PTI BSc 2</span>
            <span class="item">PTI BSc 3</span>
        </div>


        <b>display: inline</b>
        <div class="BV2">
            <span class="item">PTI BSc 1</span>
            <span class="item">PTI BSc 2</span>
            <span class="item">PTI BSc 3</span>
        </div>

        <b>display: block</b>
        <div class="BV3">
            <span class="item">PTI BSc 1</span>
            <span class="item">PTI BSc 2</span>
            <span class="item">PTI BSc 3</span>
        </div>

        <b>display: inline-block</b>
        <div class="BV4">
            <span class="item">PTI BSc 1</span>
            <span class="item">PTI BSc 2</span>
            <span class="item">PTI BSc 3</span>
        </div>

        <b>display: flex</b>
        <div class="BV5">
            <span class="item">PTI BSc 1</span>
            <span class="item">PTI BSc 2</span>
            <span class="item">PTI BSc 3</span>
        </div>

    </body>
</html>
